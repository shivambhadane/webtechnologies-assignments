<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Student Results - Spring Boot JPA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #0f172a; }
    </style>
</head>
<body class="p-4 p-md-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Student Results Archive</h3>
                <p class="text-muted mb-0">Persisted in JPA / Database (MySQL / H2)</p>
            </div>
            <a th:href="@{/}" class="btn btn-primary fw-semibold"><i class="bi bi-plus-lg me-1"></i> Add New Student Result</a>
        </div>

        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>PRN</th>
                            <th>Student Name</th>
                            <th>Branch</th>
                            <th class="text-center">Total / 400</th>
                            <th class="text-center">Percentage</th>
                            <th class="text-center">SGPA</th>
                            <th class="text-center">Status</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${results}">
                            <td class="fw-bold" th:text="${r.prn}">12210892</td>
                            <td th:text="${r.studentName}">Shivam Bhadane</td>
                            <td th:text="${r.branch}">Computer Engineering</td>
                            <td class="text-center fw-semibold" th:text="${r.grandTotal}">340.6</td>
                            <td class="text-center" th:text="${r.percentage} + '%'">85.15%</td>
                            <td class="text-center fw-bold text-primary" th:text="${r.sgpa}">9.25</td>
                            <td class="text-center">
                                <span class="badge" th:classappend="${r.overallStatus == 'PASS' ? 'bg-success' : 'bg-danger'}" th:text="${r.overallStatus}">PASS</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{'/result/' + ${r.id}}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye me-1"></i> View Grade Card
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
