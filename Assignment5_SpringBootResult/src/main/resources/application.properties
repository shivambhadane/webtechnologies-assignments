server.port=8082
spring.application.name=VIT-Semester-Result-System

# Default In-Memory H2 Database (Enables zero-setup instant execution)
spring.datasource.url=jdbc:h2:mem:vitresults;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console enabled at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf caching disabled for hot dev reloads
spring.thymeleaf.cache=false

